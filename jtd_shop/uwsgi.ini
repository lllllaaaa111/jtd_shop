[uwsgi]
# Django相关配置
chdir = /data/jtd_backend/jtd_shop
module = App_backend.wsgi:application
env = DJANGO_SETTINGS_MODULE=App_backend.settings

# 进程相关
master = true
processes = 4
threads = 2

# 网络配置
socket = /tmp/uwsgi.sock
chmod-socket = 666
vacuum = true

# 日志配置
logto = /data/uwsgi.log
log-maxsize = 50000000

# 自动重启
py-autoreload = 1

# 用户权限
uid = www-data
gid = www-data

# 其他配置
die-on-term = true
harakiri = 30
max-requests = 1000
buffer-size = 32768 