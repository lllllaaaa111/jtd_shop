server {
    listen 80;
    server_name _;  # 匹配所有域名，生产环境请指定具体域名
    
    # 客户端最大请求体大小
    client_max_body_size 100M;
    
    # 静态文件处理
    location /static/ {
        alias /data/jtd_backend/jtd_shop/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # 媒体文件处理
    location /media/ {
        alias /data/jtd_backend/jtd_shop/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # 转发到Gunicorn
    location / {
        proxy_pass http://127.0.0.1:6580;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # 健康检查端点
    location /health/ {
        proxy_pass http://127.0.0.1:6580/health/;
        access_log off;
    }
}

# HTTPS配置（可选）
server {
    listen 443 ssl http2;
    server_name _;  # 生产环境请指定具体域名
    
    # SSL证书配置（需要先获取证书）
    # ssl_certificate /path/to/your/certificate.crt;
    # ssl_certificate_key /path/to/your/private.key;
    
    # SSL安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # 其他配置与HTTP相同
    client_max_body_size 100M;
    
    location /static/ {
        alias /data/jtd_backend/jtd_shop/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    location /media/ {
        alias /data/jtd_backend/jtd_shop/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    location / {
        proxy_pass http://127.0.0.1:6580;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
} 